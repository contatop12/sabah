<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | Sabah</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  </svg>

  <div class="bg" aria-hidden="true">
    <picture>
      <source type="image/avif" srcset="/img/bg-1280.avif 1280w, /img/bg-1920.avif 1920w" sizes="100vw" />
      <source type="image/webp" srcset="/img/bg-1280.webp 1280w, /img/bg-1920.webp 1920w" sizes="100vw" />
      <img src="/img/bg-1280.jpg" srcset="/img/bg-1280.jpg 1280w, /img/bg-1920.jpg 1920w" sizes="100vw" width="1920" height="1280" alt="" fetchpriority="high" decoding="async" />
    </picture>
  </div>

  <div class="page">
    <header class="top">
      <img class="top__logo" src="/avatar-150.png" srcset="/avatar-150.png 1x, /avatar-260.png 2x" width="112" height="112" alt="Sabah – A Legítima Cozinha Árabe" />
      <h1 class="top__headline">Página não encontrada.</h1>
      <p class="top__where">O endereço que você abriu não existe.</p>
    </header>
    <main>
      <ul class="list">
        <li>
          <a class="btn" href="{{base}}">
            <svg class="btn__icon" aria-hidden="true"><use href="#i-home"/></svg>
            <span class="btn__text"><span class="btn__title">Voltar aos links do Sabah</span></span>
            <svg class="btn__chevron" aria-hidden="true"><use href="#i-chevron-right"/></svg>
          </a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
