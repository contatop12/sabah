<!--
  Sabah – Conteúdo do POPUP DO ELEMENTOR PRO "Votação" (Campeões da Gastronomia • GoWhere 2026)

  Use este arquivo DENTRO de um template de Popup do Elementor (Modelos > Popups > "Votação").
  Ele é só o conteúdo: quem abre, fecha e controla a frequência é o próprio Elementor.
  (Para usar sem Popup do Elementor, use popup-votacao-standalone.html.)

  PASSO A PASSO
  1. Abra o popup "Votação" no Elementor. APAGUE o widget HTML antigo, coloque um novo widget "HTML"
     e cole TODO este arquivo nele.
  2. O CSS abaixo ajusta a moldura do Elementor sozinho (largura 420 px, sem fundo branco, sem
     padding, fundo da página em degradê, esconde o X padrão). Se algo não ficar certo, ajuste
     manualmente na engrenagem (Configurações do popup):
       - Layout: Largura 420 px · Altura "Ajustar ao conteúdo" · Posição centro
       - Estilo > Popup: fundo transparente · Preenchimento 0
       - Botão Fechar: Ocultar (o card tem o próprio X)
  3. Publicar > Condições: "Site inteiro" (ou "Página inicial").
  4. Gatilhos: "Ao carregar a página" · 1 segundo.
  5. Regras avançadas: "Mostrar até X vezes" = 1, por "Sessão".
  6. Configurações avançadas: deixe DESLIGADO "Impedir fechar ao clicar fora" e "Impedir fechar com ESC".
  7. Teste em janela anônima (a regra de 1 vez por sessão esconde o popup depois da primeira vez).

  Trocar a foto: altere a URL em --sbh-foto (logo abaixo, no <style>).
  Intensidade do degradê sobre a foto: --sbh-degrade.

  Obs.: o popup 528 (WhatsApp) também abre ao carregar a página. Durante a campanha, desative-o
  ou mude o gatilho dele, para não abrir dois popups.
-->
