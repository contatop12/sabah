<!--
  Sabah – POPUP DO ELEMENTOR PRO "Votação", versão SÓ IMAGEM (arte "Vote no Sabah")

  Usa a arte já enviada para a biblioteca de mídia (ID 797):
  https://sabah.com.br/wp-content/uploads/2026/10/WhatsApp-Image-2026-10-07-at-12.14.58.jpeg
  A borda desfocada de fora do card é recortada pelo CSS; não precisa editar a imagem.

  A arte inteira é clicável e leva à votação. O "×" desenhado na arte fecha o popup
  (há uma área invisível de 44 px exatamente sobre ele).

  PASSO A PASSO
  1. Abra o popup "Votação" no Elementor. Apague o widget HTML atual, coloque um novo
     widget "HTML" e cole TODO este arquivo.
  2. O CSS abaixo ajusta a moldura do Elementor sozinho (sem fundo branco, sem padding,
     esconde o X padrão, fundo da página em degradê). Se a moldura branca aparecer,
     na engrenagem do popup: Largura 420 px · Altura "Ajustar ao conteúdo" · Fundo
     transparente · Preenchimento 0 · Botão Fechar: Ocultar.
  3. Condições: "Site inteiro". Gatilhos: "Ao carregar a página", 1 segundo.
     Regras avançadas: "Mostrar até 1 vez por sessão".
     Deixe DESLIGADO "Impedir fechar ao clicar fora" e "Impedir fechar com ESC".
  4. Teste em janela anônima.

  Trocar a arte por outra com o MESMO layout: troque o src da <img>. Se a nova arte tiver
  outras medidas, os percentuais do recorte (.sbh-art__img) e do X (.sbh-art__close) mudam.
-->

<div class="sbh-art">
  <a class="sbh-art__link" href="https://gowhere.com.br/campeoes-da-gastronomia-de-sao-paulo-2026/" target="_blank" rel="noopener noreferrer"
     onclick="window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'bio_link_click',link_name:'gowhere'});">
    <img class="sbh-art__img no-lazy"
         src="https://sabah.com.br/wp-content/uploads/2026/10/WhatsApp-Image-2026-10-07-at-12.14.58.jpeg"
         width="1122" height="1402"
         alt="Vote no Sabah. Ajude o Sabah a conquistar o título de Melhor Árabe de São Paulo. Estamos concorrendo no prêmio Campeões da Gastronomia 2026 da GoWhere, categoria Árabe. Leva menos de 1 minuto. Votar agora."
         decoding="async" fetchpriority="low" data-no-lazy="1" />
  </a>
  <a class="sbh-art__close" href="#elementor-action%3Aaction%3Dpopup%3Aclose%26settings%3DeyJkb19ub3Rfc2hvd19hZ2FpbiI6IiJ9" role="button" aria-label="Fechar"></a>
</div>
